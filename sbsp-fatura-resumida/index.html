<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGV Sabesp · Detalhes da conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
<style>
:root{
  --text-heading:#161a20;
  --text-body:#38404a;
  --text-caption:#687384;
  --text-primary:#2371e7;
  --text-primary-subtle:#13499a;
  --text-on-color:#f6f9fc;
  --text-warning:#d14700;
  --text-warning-subtle:#852b00;
  --text-success-subtle:#055e00;
  --icon-default:#4f5864;
  --icon-warning:#d14700;
  --icon-success:#118e03;
  --surface-white:#ffffff;
  --surface-subtle:#f6f8fa;
  --surface-subtle-hover:#eef1f5;
  --surface-primary:#2371e7;
  --surface-primary-hover:#1d63cf;
  --surface-primary-subtle:#f0f6ff;
  --surface-primary-subtle-hover:#dce7fe;
  --surface-warning:#f45706;
  --surface-warning-hover:#d14700;
  --surface-warning-subtle:#fff3e5;
  --surface-warning-subtle-hover:#ffe6d1;
  --surface-success-subtle:#e6fde2;
  --border-default:#c8d0da;
  --border-subtle:#e0e5eb;
  --bg-gradient:linear-gradient(180deg,#ffffff 0%,#eef6fe 30%,#daedfe 72%,#d6ecff 100%);
  --sp-3xs:4px;--sp-2xs:8px;--sp-xs:12px;--sp-sm:16px;--sp-lg:24px;--sp-xl:32px;--sp-2xl:40px;
  --r-lg:16px;--r-3xl:28px;--r-pill:1024px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --t-fast:150ms;--t-med:250ms;--t-slow:400ms;
  --sidenav-w:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:#d6ecff}
body{font-family:var(--font);color:var(--text-body);background:var(--bg-gradient) fixed;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--surface-primary);outline-offset:2px}
svg.ic{display:block;flex-shrink:0}

/* Tipografia (tokens do Figma) */
.h4{font-size:24px;font-weight:600;line-height:1.2;color:var(--text-heading);font-variation-settings:"opsz" 32}
.h3{font-size:28px;font-weight:600;line-height:1.2;font-variation-settings:"opsz" 32}
.h6{font-size:18px;font-weight:600;line-height:1.2;color:var(--text-heading);font-variation-settings:"opsz" 32}
.body-s{font-size:14px;line-height:1.4}
.body-m{font-size:16px;line-height:1.4}
.caption{font-size:12px;line-height:1.3;color:var(--text-caption)}
.label{font-size:16px;line-height:1.1}
.muted{color:var(--text-caption)}
.w5{font-weight:500}.w6{font-weight:600}

/* Estrutura */
.app{display:flex;min-height:100vh}
.sidenav{width:var(--sidenav-w);flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:var(--sp-sm) 0}
.sidenav .top{display:flex;flex-direction:column;gap:var(--sp-sm);padding:0 var(--sp-sm)}
.quick{display:flex;align-items:center;gap:var(--sp-xs);height:36px;padding:var(--sp-2xs) var(--sp-xs);border-radius:var(--r-pill);font-size:14px;font-weight:600;line-height:1.2;color:var(--text-body);align-self:flex-start;transition:background var(--t-fast) var(--ease)}
.quick:hover{background:var(--surface-primary-subtle)}
.quick .ex{color:var(--icon-default)}
.divider{height:1px;background:var(--border-subtle)}
.navlist{display:flex;flex-direction:column;gap:var(--sp-xs)}
.navitem{display:flex;align-items:center;gap:var(--sp-xs);height:48px;padding:var(--sp-xs);border-radius:999px;font-size:14px;font-weight:600;line-height:1.4;color:var(--text-body);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.navitem .ic{color:var(--icon-default);transition:color var(--t-fast) var(--ease)}
.navitem:hover{background:var(--surface-primary-subtle)}
.navitem:active{transform:scale(.98)}
.navitem.active{background:var(--surface-primary-subtle-hover);color:var(--text-primary-subtle)}
.navitem.active .ic{color:var(--text-primary-subtle)}
.sidenav .bottom{padding:0 var(--sp-sm);display:flex;flex-direction:column;align-items:center;gap:var(--sp-2xs)}
.promo{width:100%;background:var(--surface-primary-subtle);border-radius:var(--r-lg);padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-xs);font-size:14px;font-weight:500;line-height:1.4;transition:transform var(--t-fast) var(--ease)}
.promo:hover{transform:translateY(-2px)}
.promo img{width:40px;height:40px;object-fit:contain}
.dots{display:flex;gap:8px;padding:8px 16px}
.dots i{width:8px;height:8px;border-radius:999px;background:#fff}
.dots i.on{width:16px;background:var(--surface-primary)}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.navbar{display:flex;align-items:center;gap:12px;padding:var(--sp-sm);height:80px;position:relative;z-index:20}
.alert{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-sm);height:48px;padding:var(--sp-2xs) var(--sp-sm);background:var(--surface-subtle);border-radius:var(--r-pill);font-size:14px;line-height:1.4;white-space:nowrap;overflow:hidden}
.alert b{font-weight:600}
.alert img{width:28px;height:28px;object-fit:contain}
.alert span{overflow:hidden;text-overflow:ellipsis}
.mlogo{display:none}
.iconbtn{position:relative;display:flex;align-items:center;justify-content:center;padding:var(--sp-xs);border-radius:var(--r-pill);background:var(--surface-primary-subtle);color:var(--text-primary-subtle);transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.iconbtn:hover{background:var(--surface-primary-subtle-hover)}
.iconbtn:active{transform:scale(.94)}
.iconbtn[aria-expanded="true"]{background:var(--surface-primary-subtle-hover)}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--surface-warning);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;border:2px solid #fff;box-sizing:content-box;transform:translate(25%,-25%)}
.badge.pop{animation:pop var(--t-slow) var(--ease)}
.badge[hidden]{display:none}
@keyframes pop{0%{transform:translate(25%,-25%) scale(.4)}60%{transform:translate(25%,-25%) scale(1.15)}100%{transform:translate(25%,-25%) scale(1)}}
.profile{display:flex;align-items:center;gap:var(--sp-2xs);height:48px;padding:0 var(--sp-xs) 0 var(--sp-2xs);border-radius:var(--r-pill);background:var(--surface-primary-subtle);color:var(--text-primary-subtle);font-size:16px;font-weight:600;line-height:1.2;transition:background var(--t-fast) var(--ease)}
.profile:hover{background:var(--surface-primary-subtle-hover)}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--surface-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}

.body{flex:1;padding:0 var(--sp-sm) var(--sp-sm)}
.panel{background:var(--surface-white);border-radius:var(--r-3xl);padding:var(--sp-2xl);min-height:calc(100vh - 96px)}

/* Transições de tela */
.view{animation:viewIn var(--t-slow) var(--ease) both}
.view.leaving{animation:viewOut var(--t-fast) var(--ease-in) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-4px)}}
.stg>*{animation:itemIn var(--t-slow) var(--ease) both;animation-delay:calc(var(--i,0) * 50ms + 60ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Cabeçalho de página */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-lg);margin-bottom:var(--sp-2xl)}
.phead .txt{display:flex;flex-direction:column;gap:var(--sp-xs)}
.phead .sub{font-size:16px;line-height:1.1;color:var(--text-caption)}
.titlerow{display:flex;align-items:center;gap:var(--sp-xs)}
.back{padding:8px}
.place{width:286px;flex-shrink:0;display:flex;align-items:center;gap:var(--sp-xs);padding:var(--sp-sm);border:1px solid var(--border-default);border-radius:var(--r-lg);background:#fff;transition:background var(--t-fast) var(--ease)}
.place:hover{background:var(--surface-subtle)}
.place .t{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.place .t b{font-size:14px;font-weight:500;line-height:1.4}
.place .t span{font-size:12px;line-height:1.1;color:var(--text-caption)}
.place .ic{color:var(--icon-default)}
.headactions{display:flex;align-items:center;gap:var(--sp-sm);flex-shrink:0}

/* Grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-lg);align-items:start}
.gridmain{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp-lg);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--sp-lg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-lg)}

/* Cards */
.card{border:1px solid var(--border-subtle);border-radius:var(--r-lg);padding:var(--sp-lg);background:#fff;display:flex;flex-direction:column;gap:var(--sp-xl)}
.card .hl{display:flex;flex-direction:column;gap:var(--sp-2xs)}
.card .hlrow{display:flex;align-items:center;gap:var(--sp-sm)}
.card .hlrow .h6{flex:1}
.link{font-size:14px;font-weight:600;line-height:1.2;color:var(--text-primary);border-radius:6px;transition:opacity var(--t-fast) var(--ease)}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link:active{opacity:.7}
.card.warn{background:var(--surface-warning-subtle);border-color:transparent}

.fatura{background:var(--surface-warning-subtle);border-radius:var(--r-lg);padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-lg);color:var(--text-warning-subtle)}
.fatura .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;line-height:1.4}
.fatura .val{display:flex;align-items:center;gap:8px;border-radius:12px;transition:transform var(--t-fast) var(--ease)}
.fatura .val:hover{transform:translateX(2px)}
.fatura .val .v{flex:1;display:flex;flex-direction:column;gap:8px}
.fatura .val .ic{color:var(--text-warning)}
.actions{display:flex;gap:12px}
.actions>*{flex:1}

/* Chips de status */
.chip{display:inline-flex;align-items:center;gap:8px;height:24px;padding:4px 12px;border-radius:var(--r-pill);font-size:14px;font-weight:500;line-height:1.4;white-space:nowrap}
.chip.sm{height:20px}
.chip::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor;flex-shrink:0}
.chip.warn{background:var(--surface-warning-subtle-hover);color:var(--text-warning-subtle)}
.chip.warn::before{background:var(--icon-warning)}
.chip.warn.light{background:var(--surface-warning-subtle)}
.chip.ok{background:var(--surface-success-subtle);color:var(--text-success-subtle)}
.chip.ok::before{background:var(--icon-success)}
.chip.info{background:var(--surface-primary-subtle);color:var(--text-primary-subtle)}
.chip.info::before{background:var(--surface-primary)}
.chip.neutral{background:var(--surface-subtle);color:var(--text-body)}
.chip.neutral::before{background:var(--text-caption)}
.chip.cat{background:#fff;border:1px solid var(--border-subtle);color:var(--text-body)}
.chip.cat::before{display:none}

/* Botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 var(--sp-lg);border-radius:var(--r-pill);font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease)}
.btn:active{transform:scale(.98)}
.btn.warn{background:var(--surface-warning);color:var(--text-on-color)}
.btn.warn:hover{background:var(--surface-warning-hover)}
.btn.warn-tonal{background:var(--surface-warning-subtle-hover);color:var(--text-warning)}
.btn.warn-tonal:hover{background:#ffd9b8}
.btn.primary{background:var(--surface-primary);color:var(--text-on-color)}
.btn.primary:hover{background:var(--surface-primary-hover)}
.btn.tonal{background:var(--surface-primary-subtle);color:var(--text-primary-subtle)}
.btn.tonal:hover{background:var(--surface-primary-subtle-hover)}
.btn.sm{height:40px;padding:0 var(--sp-sm);font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.spin{width:18px;height:18px;border-radius:999px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* List tiles */
.tile{display:flex;align-items:center;gap:var(--sp-sm);padding:var(--sp-lg);border:1px solid var(--border-default);border-radius:var(--r-lg);background:#fff;width:100%;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.tile:hover{background:var(--surface-subtle)}
.tile:active{transform:scale(.99)}
.tile .ic{color:var(--icon-default)}
.tile .t{flex:1;display:flex;flex-direction:column;gap:4px}
.tile .t b{font-size:16px;font-weight:500;line-height:1.4}
.tile .t span{font-size:14px;line-height:1.4;color:var(--text-caption)}
.gtile{background:var(--surface-subtle);border-radius:var(--r-lg);padding:var(--sp-lg);display:flex;flex-direction:column;gap:32px;font-size:16px;font-weight:500;line-height:1.4;width:100%;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.gtile .ic{color:var(--icon-default)}
.gtile:hover{background:var(--surface-subtle-hover);transform:translateY(-2px)}
.gtile:active{transform:scale(.99)}

/* Tabela de contas */
.trow{display:flex;align-items:center;height:56px;border-radius:12px;margin:0 -8px;padding:0 8px;transition:background var(--t-fast) var(--ease)}
.trow:hover{background:var(--surface-subtle)}
.trow .c1{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.trow .c1 b{font-size:14px;font-weight:500;line-height:1.4}
.trow .c2{padding:0 8px}
.trow .c3{padding-left:8px;font-size:16px;font-weight:600;line-height:1.1;text-align:right}
.tbody{display:flex;flex-direction:column;gap:var(--sp-lg)}

/* Lista de serviços */
.slist{display:flex;flex-direction:column;margin:-15px 0}
.sitem{display:flex;align-items:center;gap:var(--sp-xs);padding:23px 8px;margin:0 -8px;border-radius:12px;font-size:16px;font-weight:500;line-height:1.4;transition:background var(--t-fast) var(--ease)}
.sitem:hover{background:var(--surface-subtle)}
.sitem .ic{color:var(--icon-default)}
.sitem .t{flex:1}
.sitem+.sep{height:1px;background:var(--border-subtle)}

/* Popover do sino */
.bellwrap{position:relative}
.pop{position:absolute;top:calc(100% + 12px);right:0;width:400px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--r-lg);box-shadow:0 16px 40px rgba(22,26,32,.12);display:flex;flex-direction:column;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;visibility:hidden;transition:opacity var(--t-med) var(--ease),transform var(--t-med) var(--ease),visibility 0s linear var(--t-med);overflow:hidden}
.pop.open{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition-delay:0s}
.pop .ph{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-lg) var(--sp-lg) var(--sp-xs)}
.pop .plist{display:flex;flex-direction:column;padding:0 var(--sp-xs);max-height:420px;overflow:auto}
.pop .pf{border-top:1px solid var(--border-subtle);padding:var(--sp-sm);display:flex;justify-content:center}

/* Item de notificação */
.nitem{display:flex;align-items:flex-start;gap:var(--sp-sm);padding:var(--sp-sm) var(--sp-xs);border-radius:12px;width:100%;transition:background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.nitem:hover{background:var(--surface-subtle)}
.nitem:active{transform:scale(.99)}
.card.warn .nitem:hover{background:var(--surface-warning-subtle-hover)}
.nicon{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nicon.u1{background:var(--surface-warning-subtle-hover);color:var(--icon-warning)}
.nicon.u2{background:var(--surface-primary-subtle);color:var(--surface-primary)}
.nicon.u3{background:var(--surface-subtle);color:var(--icon-default)}
.card.warn .nicon.u1{background:#fff}
.nitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.nitem .t b{font-size:16px;font-weight:500;line-height:1.4;color:var(--text-body)}
.nitem.unread .t b{font-weight:600;color:var(--text-heading)}
.nitem .t span{font-size:14px;line-height:1.4;color:var(--text-caption);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nitem .meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px;flex-shrink:0}
.udot{width:8px;height:8px;border-radius:999px;background:var(--surface-primary);transition:transform var(--t-med) var(--ease),opacity var(--t-med) var(--ease)}
.nitem:not(.unread) .udot{transform:scale(0);opacity:0}
.nsep{height:1px;background:var(--border-subtle);margin:0 var(--sp-xs)}
.card.warn .nsep{background:#ffdcc2}
.nlist{display:flex;flex-direction:column;margin:-8px -12px}
.compact .nitem{padding:12px}
.compact .nicon{width:36px;height:36px}
.compact .nitem .t b{font-size:14px}

/* Filtros */
.filters{display:flex;gap:var(--sp-2xs);overflow-x:auto;scrollbar-width:none;margin:0 -4px var(--sp-lg);padding:4px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0}
.fchip{display:flex;align-items:center;gap:8px;height:36px;padding:0 var(--sp-sm);border:1px solid var(--border-default);border-radius:var(--r-pill);font-size:14px;font-weight:500;line-height:1.4;color:var(--text-body);background:#fff;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.fchip:hover{background:var(--surface-subtle)}
.fchip:active{transform:scale(.97)}
.fchip[aria-pressed="true"]{background:var(--surface-primary-subtle-hover);border-color:var(--surface-primary-subtle-hover);color:var(--text-primary-subtle)}
.fchip .n{font-size:12px;color:inherit;opacity:.75}

/* Resumo */
.sumrow{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;margin:0 -8px;border-radius:12px;width:calc(100% + 16px);transition:background var(--t-fast) var(--ease)}
.sumrow:hover{background:var(--surface-subtle)}
.sumrow .n{font-size:16px;font-weight:600}
.sumlist{display:flex;flex-direction:column}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--surface-subtle) 0%,#eef1f5 50%,var(--surface-subtle) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:8px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skrow{display:flex;gap:16px;padding:16px 12px}
.skrow .a{width:40px;height:40px;border-radius:999px}
.skrow .b{flex:1;display:flex;flex-direction:column;gap:8px}

/* Vazio */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-sm);padding:56px var(--sp-lg)}
.empty .em{width:64px;height:64px;border-radius:999px;background:var(--surface-success-subtle);color:var(--icon-success);display:flex;align-items:center;justify-content:center}
.empty p{max-width:320px}

/* Detalhe */
.dchips{display:flex;gap:8px;flex-wrap:wrap}
.drows{display:flex;flex-direction:column}
.drow{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--border-subtle);font-size:14px;line-height:1.4}
.drow:first-child{border-top:0;padding-top:0}
.drow:last-child{padding-bottom:0}
.card.warn .drow{border-color:#ffdcc2}
.drow span{color:var(--text-caption)}
.drow b{font-weight:500;text-align:right}
.card.warn .drow span,.card.warn .drow b{color:var(--text-warning-subtle)}
.tips{display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.4}
.tips li{list-style:none;display:flex;gap:12px}
.tips li::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--surface-primary);margin-top:7px;flex-shrink:0}

/* Preferências */
.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,88px);align-items:center;gap:8px;padding:16px 8px;margin:0 -8px;border-radius:12px;transition:background var(--t-fast) var(--ease)}

const barItems=()=>{const s=getSeen();return sorted().filter(n=>n.atrito<=2).slice(0,3)};
function renderBar(){

    </div>`).join("")}</div>
    ${items.length>1?`<div class="actl"><button class="pbtn" id="cprev" aria-label="Aviso anterior">${I("prev",20)}</button><span class="pos" id="cpos">${cIdx+1} de ${items.length}</span><button class="pbtn" id="cnext" aria-label="Próximo aviso">${I("next",20)}</button><button class="pbtn" id="cpause" aria-label="${cPaused?"Retomar avisos":"Pausar avisos"}" aria-pressed="${cPaused}">${I(cPaused?"play":"pause",20)}</button></div>`:""}`;
  abar.classList.toggle("f1",items[cIdx].atrito===1);
}
function goTo(i){
  const items=barItems();if(items.length<2)return;
  const els=abar.querySelectorAll(".aitem");
  const prev=els[cIdx];cIdx=(i+items.length)%items.length;const next=els[cIdx];
  if(prev){prev.classList.remove("on");prev.classList.add("out");prev.setAttribute("aria-hidden","true");prev.querySelectorAll("button").forEach(b=>b.tabIndex=-1);setTimeout(()=>prev.classList.remove("out"),260)}
  next.classList.add("on");next.removeAttribute("aria-hidden");next.querySelectorAll("button").forEach(b=>b.removeAttribute("tabindex"));
  abar.classList.toggle("f1",items[cIdx].atrito===1);
  document.getElementById("cpos").textContent=`${cIdx+1} de ${items.length}`;
}
function tick(){if(!cPaused&&!cHover&&!cFocus&&!overlayOpen())goTo(cIdx+1)}
function startTimer(){clearInterval(cTimer);cTimer=setInterval(tick,5000)}
abar.addEventListener("mouseenter",()=>cHover=true);
abar.addEventListener("mouseleave",()=>{cHover=false;startTimer()});

abar.addEventListener("click",e=>{
  if(e.target.closest("#cprev")){goTo(cIdx-1);startTimer();return}
  if(e.target.closest("#cnext")){goTo(cIdx+1);startTimer();return}

  cPaused=!cPaused;const b=document.getElementById("cpause");
  b.setAttribute("aria-pressed",cPaused);b.setAttribute("aria-label",cPaused?"Retomar avisos":"Pausar avisos");b.innerHTML=I(cPaused?"play":"pause",20);

});

function syncHead(){document.getElementById("mtit").textContent=MESES[MES].curto}
function afterDetail(){
  syncHead();
  const el=document.getElementById("amount"),tot=MESES[MES].total;
  document.querySelectorAll("#mview .stg").forEach(s=>[...s.children].forEach((c,i)=>c.style.setProperty("--i",i)));
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const t0=performance.now(),D=400;
  const step=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=brl(tot*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function setMes(k){
  if(k===MES||!MESES[k])return;
  const v=document.getElementById("mview");
  const swap=()=>{MES=k;clearTimeout(pdfTimer);setPdf("idle");showErr(false);v.classList.remove("leaving");v.innerHTML=vMes();v.style.animation="none";v.offsetHeight;v.style.animation="";afterDetail();document.getElementById("panel").scrollTop=0};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){swap();return}
  v.classList.add("leaving");setTimeout(swap,150);
}

/* Seletor de fatura no título */
function mopt(k){
  const m=MESES[k],cur=k===MES;
  return `<button class="mopt${cur?" cur":""}" role="option" data-fmes="${k}" aria-selected="${cur}" tabindex="-1"><span class="m">${m.mesCap}</span>${chipSt(m,1)}<span class="v">${brl(m.total)}</span></button>`;
}
function popRender(){
  const anos=[...new Set(ORDEM.map(k=>MESES[k].ano))];
  document.getElementById("mpop").innerHTML=`<div class="mscroll">${anos.map(a=>`<div class="mgrp" role="group" aria-label="${a}"><div class="mgt" aria-hidden="true">${a}</div>${ORDEM.filter(k=>MESES[k].ano===a).map(mopt).join("")}</div>`).join("")}</div>`;
}
function openPop(){
  popRender();const p=document.getElementById("mpop"),b=document.getElementById("msel");
  p.classList.add("open");b.setAttribute("aria-expanded","true");
  const c=p.querySelector(".mopt.cur");if(c){const s=p.querySelector(".mscroll");s.scrollTop=c.offsetTop-s.clientHeight/2+c.offsetHeight/2;setTimeout(()=>c.focus({preventScroll:true}),30)}
}
function closePop(focusBack){const p=document.getElementById("mpop"),b=document.getElementById("msel");if(!p||!p.classList.contains("open"))return;p.classList.remove("open");b.setAttribute("aria-expanded","false");if(focusBack)b.focus()}
document.addEventListener("keydown",e=>{
  const p=document.getElementById("mpop");if(!p||!p.classList.contains("open"))return;
  if(e.key==="Escape"){e.preventDefault();closePop(true);return}
  if(e.key==="Tab"){closePop(false);return}
  const o=[...p.querySelectorAll(".mopt")],i=o.indexOf(document.activeElement);
  const to=j=>{e.preventDefault();o[Math.max(0,Math.min(o.length-1,j))].focus()};
  if(e.key==="ArrowDown")to(i+1);else if(e.key==="ArrowUp")to(i-1);else if(e.key==="Home")to(0);else if(e.key==="End")to(o.length-1);
});

function setPdf(st){pdfState=st;const b=document.getElementById("pdfbtn");if(!b)return;b.innerHTML=pdfInner();b.setAttribute("aria-disabled",st==="loading")}
function showErr(on){
  const w=document.getElementById("pdferr");if(!w)return;
  w.innerHTML=on===true?`<div class="ierr" role="alert">${SV(P_ERR,20)}<span>Não foi possível gerar o PDF agora. Tente novamente em alguns minutos.</span><button id="pdfretry">Tentar de novo</button></div>`
    :on==="ready"?`<div class="ierr iok" role="status">${SV(P_CHECKC,20)}<span>Sua conta em PDF está pronta.</span><button id="pdfopen">Abrir conta em PDF</button></div>`:"";
}
function genPdf(){
  showErr(false);setPdf("loading");clearTimeout(pdfTimer);
  pdfTimer=setTimeout(()=>{if(ROUTE!=="detail")return;setPdf("idle");showErr(pdfMode==="err"?true:"ready")},2000);
}
/* Menu da 2ª via */
function xOpen(){const m=document.getElementById("xmenu"),b=document.getElementById("pdfbtn");m.classList.add("open");b.setAttribute("aria-expanded","true");setTimeout(()=>document.getElementById("xpdf").focus(),30)}
function xClose(back){const m=document.getElementById("xmenu"),b=document.getElementById("pdfbtn");if(!m||!m.classList.contains("open"))return;m.classList.remove("open");b.setAttribute("aria-expanded","false");if(back)b.focus()}
document.addEventListener("keydown",e=>{
  const m=document.getElementById("xmenu");if(!m||!m.classList.contains("open"))return;
  if(e.key==="Escape"){e.preventDefault();xClose(true);return}
  if(e.key==="Tab"){xClose(false);return}
  const it=[...m.querySelectorAll(".xitem")],i=it.indexOf(document.activeElement);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();it[(i+(e.key==="ArrowDown"?1:-1)+it.length)%it.length].focus()}
});
/* Envio por WhatsApp */
const fmtCel=d=>d.length<3?(d?`(${d}`:""):d.length<8?`(${d.slice(0,2)}) ${d.slice(2)}`:`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7,11)}`;
const maskCel=d=>`(${d.slice(0,2)}) ${d[2]}••••-${d.slice(7)}`;
const wdlg=document.getElementById("wdlg"),wscrim=document.getElementById("wscrim");
function wRender(){
  const m=MESES[MES],other=wNum&&wNum!==CEL_CAD;
  const head=`<div class="wh"><h2 class="h6" id="wtit">Enviar por WhatsApp</h2><button class="iconbtn" id="wclose" aria-label="Fechar">${SV(P_CLOSE,24)}</button></div>`;
  const err=wErr?`<div class="ierr" role="alert">${SV(P_ERR,20)}<span>${wErr}</span></div>`:"";
  const send=`<button class="btn primary" id="wsend" ${wSending?'aria-disabled="true"':""}>${wSending?'<span class="spin" aria-hidden="true"></span>Enviando…':"Enviar"}</button>`;
  let body,acts;
  if(wStep==="edit"){
    body=`<p class="wsub">Digite o número que vai receber a 2ª via de ${m.curto}.</p>
      <div class="fld${wErr?" bad":""}"><label for="wnum">Número de WhatsApp</label><input id="wnum" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="(00) 00000-0000" value="${wNum&&wNum!==CEL_CAD?fmtCel(wNum):""}" ${wErr?'aria-invalid="true" aria-describedby="wfe"':""}>${wErr?`<span class="fe" id="wfe">${wErr}</span>`:""}</div>`;
    acts=`<button class="btn tonal" id="wback">Voltar</button><button class="btn primary" id="wnext">Continuar</button>`;
    return head+body+`<div class="wacts">${acts}</div>`;
  }
  if(wStep==="confirm"){
    body=`<p class="wsub">A conta tem seus dados, como nome e endereço. Confira se o número está certo antes de enviar.</p>
      <div class="wbox"><span>Enviar para</span><b class="big">${fmtCel(wNum)}</b></div>${err}`;
    acts=`<button class="btn tonal" id="wfix">Corrigir número</button>${send}`;
    return head+body+`<div class="wacts">${acts}</div>`;
  }
  body=`<p class="wsub">A 2ª via de ${m.curto} será enviada pelo WhatsApp oficial da Sabesp.</p>
    <div class="wbox"><span>Enviar para</span><b>${maskCel(CEL_CAD)}</b><span class="hint">Número do seu cadastro</span><button class="link" id="wchange">Trocar número</button></div>${err}`;
  acts=`<button class="btn tonal" id="wcancel">Cancelar</button>${send}`;
  return head+body+`<div class="wacts">${acts}</div>`;
}
function wPaint(focusSel){wdlg.innerHTML=wRender();const f=focusSel&&wdlg.querySelector(focusSel);if(f)f.focus()}
function wOpen(){wStep="pick";wNum=null;wErr="";wSending=false;wLast=document.getElementById("pdfbtn");wPaint();wdlg.classList.add("open");wscrim.classList.add("open");wdlg.setAttribute("aria-hidden","false");setTimeout(()=>{const s=document.getElementById("wsend");s&&s.focus()},60)}
function wClose(){if(!wdlg.classList.contains("open"))return;wdlg.classList.remove("open");wscrim.classList.remove("open");wdlg.setAttribute("aria-hidden","true");if(wLast&&document.body.contains(wLast))wLast.focus()}
function wSend(){
  if(wSending)return;wSending=true;wErr="";wPaint();
  setTimeout(()=>{wSending=false;
    if(pdfMode==="err"){wErr="Não foi possível enviar agora. Tente novamente em alguns minutos.";wPaint("#wsend");return}
    const n=wNum||CEL_CAD;wClose();toast(`Pronto! A conta chega no WhatsApp ${maskCel(n)} em alguns minutos.`,true,4000);invShow(900);
  },1500);
}
function wNext(){
  const d=(document.getElementById("wnum").value||"").replace(/\D/g,"");
  if(d.length!==11||d[2]!=="9"){wErr="Digite um celular com DDD, como (11) 91234-5678.";wNum=d;wPaint("#wnum");return}
  wErr="";wNum=d;if(d===CEL_CAD){wStep="pick";wPaint("#wsend")}else{wStep="confirm";wPaint("#wsend")}
}
wscrim.addEventListener("click",wClose);
/* Convite passivo para a conta digital (não modal) */
const inv=document.getElementById("invite");
function invShow(delay){if(invDone)return;invDone=true;clearTimeout(invTimer);invTimer=setTimeout(()=>{if(ROUTE!=="detail")return;inv.classList.add("open");inv.setAttribute("aria-hidden","false")},delay||0)}
function invHide(){clearTimeout(invTimer);inv.classList.remove("open");inv.setAttribute("aria-hidden","true")}
wdlg.addEventListener("input",e=>{if(e.target.id==="wnum"){const d=e.target.value.replace(/\D/g,"").slice(0,11);e.target.value=fmtCel(d)}});
wdlg.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="wnum"){e.preventDefault();wNext()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&wdlg.classList.contains("open"))wClose()});
function detailClick(e){
  if(!e.target.closest(".xw"))xClose(false);
  if(!e.target.closest(".msel-w"))closePop(false);
  if(e.target.closest("#msel")){const p=document.getElementById("mpop");p.classList.contains("open")?closePop(false):openPop();return true}
  const fr=e.target.closest("[data-fmes]");if(fr){closePop(true);setMes(fr.dataset.fmes);return true}
  const m=e.target.closest("[data-pdfmode]");
  if(m){pdfMode=m.dataset.pdfmode;document.querySelectorAll("[data-pdfmode]").forEach(b=>b.setAttribute("aria-pressed",b===m));setPdf("idle");showErr(false);return true}
  if(e.target.closest("#pdfretry")){genPdf();return true}
  if(e.target.closest("#pdfopen")){showErr(false);toast("Aqui o PDF abriria em uma nova aba");invShow(900);return true}
  if(e.target.closest("#invx")||e.target.closest("#invno")){invHide();return true}
  if(e.target.closest("#invgo")){invHide();return false}
  if(e.target.closest("#pdfbtn")){if(pdfState==="idle"){const m=document.getElementById("xmenu");m.classList.contains("open")?xClose(false):xOpen()}return true}
  if(e.target.closest("#xpdf")){xClose(false);genPdf();return true}
  if(e.target.closest("#xwa")){xClose(false);wOpen();return true}
  if(e.target.closest("#wclose")||e.target.closest("#wcancel")){wClose();return true}
  if(e.target.closest("#wchange")||e.target.closest("#wfix")){wStep="edit";wErr="";wPaint("#wnum");return true}
  if(e.target.closest("#wback")){wStep="pick";wNum=null;wErr="";wPaint("#wsend");return true}
  if(e.target.closest("#wnext")){wNext();return true}
  if(e.target.closest("#wsend")){wSend();return true}
  if(e.target.closest("#copypix")){try{navigator.clipboard&&navigator.clipboard.writeText(PIX).catch(()=>{})}catch(_){}toast("Código Pix copiado",true,3000);return true}
  if(e.target.closest("#copybar")){try{navigator.clipboard&&navigator.clipboard.writeText(BARRAS).catch(()=>{})}catch(_){}toast("Código copiado",true,3000);return true}
  return false;
}
document.getElementById("panel").addEventListener("scroll",e=>{const h=e.currentTarget.querySelector(".dhead");if(h)h.classList.toggle("stuck",e.currentTarget.scrollTop>4)},{passive:true});
function go(r,mes){
  if(r==="detail"&&ROUTE==="detail"){setMes(mes||"2026-10");return}
  if(r===ROUTE)return;
  const cur=document.querySelector("#panel .view");
  const swap=()=>{invHide();ROUTE=r;MES=mes||"2026-10";clearTimeout(pdfTimer);pdfState="idle";renderNav();renderHome();document.getElementById("panel").scrollTop=0};
  if(!cur||matchMedia("(prefers-reduced-motion: reduce)").matches){swap();return}
  cur.classList.add("leaving");setTimeout(swap,150);
}

renderNav();

  ["Fatura em atraso + Fatura em aberto",{c:"v-red",chip:"Contas pendentes",when:"Setembro, 2026",val:"R$ 400,00",sub:"2 contas em atraso<i style=\"display:inline-block;width:3px;height:3px;border-radius:9px;background:currentColor;margin:0 8px;vertical-align:middle\"></i>1 conta em aberto",p1:"Pagar",p2:"2ª via"}]
];
function conV(o){
  const data=o.d,mx=Math.max(...data.filter(Boolean)),H=110,ms=["Abr, 26","Mai, 26","Jun, 26","Jul, 26","Ago, 26","Set, 26"];
  return `<section class="card fill"><div class="hl"><div class="hlrow"><h2 class="h6">Consumo</h2><button class="link" data-oos>Ver mais</button></div>
    ${o.icon?`<span class="trend ${o.k||""}">${SV(o.icon,16)}${o.t}</span>`:`<span class="body-s muted">${o.t}</span>`}</div>
    <div class="chart2"><div class="bars2">${data.map((v,i)=>{const cur=i===5;return v?`<div class="b2${cur?" cur":""}">${cur?`<b>${v.toLocaleString("pt-BR")} L</b>`:""}<i style="height:${Math.round(v/mx*H)}px"></i></div>`:`<div class="b2 nd"><i></i></div>`}).join("")}</div>
    <div class="mon">${data.map((v,i)=>`<span class="${i===5?"cur":""}">${v?ms[i]:"-"}</span>`).join("")}</div></div></section>`;
}
const CONS=[
  ["Primeiro mês de consumo",{t:"Seus próximos consumos aparecerão aqui",d:[0,0,0,0,0,4710]}],
  ["A partir do segundo mês de consumo",{icon:P_TREND,t:"+20% no último mês",d:[0,0,0,0,3925,4710]}],
  ["Consumo mais de 10% acima do mês anterior",{icon:P_TREND,t:"+20% no último mês",d:[3900,4100,3900,3900,3925,4710]}],
  ["Consumo mais de 10% abaixo do mês anterior",{icon:P_DOWN,k:"ok",t:"-20% no último mês",d:[3900,4100,3900,3900,4100,3280]}],
  ["Consumo até 10% acima ou abaixo do mês anterior",{icon:P_FLAT,k:"neu",t:"Sem grande variação no último mês",d:[3900,4100,3900,3900,4100,4150]}]
];
function cdV(t,sub){return `<button class="ptile" data-oos style="background:#fff">${I("receba",24)}<span class="t"><b>${t}</b><span>${sub}</span></span>${I("chev",24)}</button>`}
function acdV(k,app){
  const C={b:["var(--surface-primary)","Acordo em andamento","Próxima parcela vence em 20/10",`<button class="btn tonal sm" data-oos>Ver acordo</button>`,""],
    o:["var(--surface-warning)","Acordo em andamento","Próxima parcela vence em 5 dias",`<button class="btn otonal sm" data-oos>${I("card",20)}Pagar</button>`,"c-o"],
    r:["#db0f0f",app?"Acordo em andamento":"Acordo em atraso","Última parcela venceu em 10/09",`<button class="btn rtonal sm" data-oos>${I("card",20)}Pagar</button>`,"c-r"]}[k];
  const r=20,c=2*Math.PI*r;
  const ring=`<span class="ring"><svg class="rg" width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="2.5"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${C[0]}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(c*.7).toFixed(1)} ${c.toFixed(1)}"/></svg>${I("acordos",22)}</span>`;
  const t=`<div class="t"><b>${C[1]}</b><span>7/10 parcelas pagas<i></i><em>${C[2]}</em></span></div>`;
  return app?`<section class="acd st ${C[4]}"><div class="row">${ring}${t}</div>${C[3].replace("btn ","btn ").replace(" sm","")}</section>`:`<section class="acd ${C[4]}">${ring}${t}${C[3]}</section>`;
}
function ucV(ic,cls,lab){return `<button class="bcard" data-oos><span class="tp">Set, 2026<svg class="ic ${cls}" width="20" height="20" viewBox="0 0 24 24" aria-label="${lab}"><path fill="currentColor" d="${ic}"/></svg></span><span class="vl"><b>R$ 150,00</b><span>Vencimento: 20/10</span></span></button>`}
function emptyV(ic,t,sub){return `<section class="card empty2"><span class="eb">${I(ic,20)}</span><b>${t}</b><span>${sub}</span></section>`}
function renderVar(){
  const app=VP==="app";
  const seg=`<div class="vseg" role="group" aria-label="Plataforma"><button data-vp="web" aria-pressed="${!app}">AGV</button><button data-vp="app" aria-pressed="${app}">App</button></div>`;
  let h=`<div class="vhead"><h1>Home · Variantes dos componentes</h1>${seg}</div>`;
  h+=`<div class="vsec"><h2>Card de fatura</h2><div class="vgrid ${app?"ap":""}">${FATS.map(f=>vItem(f[0],fatV(f[1],app))).join("")}</div></div>`;
  if(!app)h+=`<div class="vsec"><h2>Card de consumo</h2><div class="vgrid">${CONS.map(c=>vItem(c[0],conV(c[1]))).join("")}</div></div>`;
  h+=`<div class="vsec"><h2>Acordo</h2><div class="vgrid ${app?"ap":""}" style="${app?"":"--cw:520px"}">${[["Acordo em andamento","b"],["Acordo em andamento (a partir de 5 dias para o vencimento)","o"],["Acordo em atraso","r"]].map(a=>vItem(a[0],acdV(a[1],app),app&&a[1]==="r"?"No Figma do app, o título está como \"Acordo em andamento\". Na AGV, \"Acordo em atraso\".":"")).join("")}</div></div>`;
  h+=`<div class="vsec"><h2>Conta digital</h2><div class="vgrid ${app?"ap":""}">${[["Conta digital inativa","Conta digital","Receba suas contas pelo WhatsApp ou e-mail"],["Conta digital ativa (WhatsApp)",app?"Conta digital":"Conta digital ativa","Envio para o WhatsApp: (11) 99999-9999"],["Conta digital ativa (e-mail)",app?"Conta digital":"Conta digital ativa","Envio para o e-mail: mariadasilva@email.com"]].map(c=>vItem(c[0],cdV(c[1],c[2]))).join("")}</div></div>`;
  if(app)h+=`<div class="vsec"><h2>Card de últimas contas</h2><div class="vgrid sm">${[["Em atraso",P_HIST,"r"],["Em aberto",P_WARN,"w"],["Paga",P_OK,"ok"],["Processando / Em negociação",P_SYNC,"b"]].map(u=>vItem(u[0],ucV(u[1],u[2],u[0]))).join("")}</div></div>`;
  h+=`<div class="vsec"><h2>Estado vazio</h2><div class="vgrid ${app?"ap":""}">${vItem("Sem faturas",emptyV("faturas","Nenhuma fatura por aqui","Assim que as faturas fecharem, elas serão exibidas aqui."))}${app?"":vItem("Sem histórico de consumo",emptyV("consumo","Nenhum histórico de consumo","Assim que houver consumo, aparecerá aqui."))}</div></div>`;
  document.getElementById("varv").innerHTML=h;
}
renderVar();
document.getElementById("varv").addEventListener("click",e=>{const b=e.target.closest("[data-vp]");if(b&&b.dataset.vp!==VP){VP=b.dataset.vp;renderVar()}});
function fitPhone(){document.querySelector(".phone").style.setProperty("--ps",Math.min(1,Math.max(.5,(innerHeight-136)/844)).toFixed(3))}
fitPhone();addEventListener("resize",fitPhone);
if(0)document.querySelector(".vtabs").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;document.querySelectorAll(".vtabs [data-v]").forEach(x=>x.setAttribute("aria-selected",x===b));document.body.classList.toggle("m-app",b.dataset.v==="app");document.body.classList.toggle("m-var",b.dataset.v==="var");window.scrollTo(0,0)});
updateBadge();
</script>
</body>
